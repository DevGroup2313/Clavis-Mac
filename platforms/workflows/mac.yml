#
# Builds "@@NAME@@.app" on GitHub's own Mac, as Carpe Diem's is built, so nothing has to be built on your Mac. The app
# is UNIVERSAL: one app for Intel Macs and Apple silicon Macs. It builds whenever something in "@@PREFIX@@Mac project"
# changes, and by hand from the Actions tab ("Build @@NAME@@ for Mac", "Run workflow"). The result, @@NAME_DASH@@-Mac.zip,
# is placed on the Releases page and under "Artifacts" on the run's page. Installing it is a copy, not a build:
# unzip, drag @@NAME@@.app to Applications. Uninstalling it is dragging it to the Bin.

name: Build @@NAME@@ for Mac

on:
  push:
    paths:
      - '@@PREFIX@@Mac project/**'
      - '.github/workflows/@@FILE@@-mac.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: @@FILE@@-mac-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      PROJ: '@@PREFIX@@Mac project'
    steps:
      - name: Get the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, runs on Node.js 24

      - name: Install Python 3.12 for Intel and Apple silicon
        # python.org's own installer is "universal2": it carries both kinds of Mac code, which a universal app needs
        run: |
          curl -sSL --retry 4 -o "$RUNNER_TEMP/python.pkg" https://www.python.org/ftp/python/3.12.10/python-3.12.10-macos11.pkg
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target / > /dev/null
          PY=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3.12
          "$PY" --version
          "$PY" -m venv "$RUNNER_TEMP/venv"
          echo "VPY=$RUNNER_TEMP/venv/bin/python" >> "$GITHUB_ENV"

      - name: Install the build tools
        run: |
          "$VPY" -m pip install --quiet --upgrade pip
          "$VPY" -m pip install --quiet pyinstaller pywebview
          "$VPY" -m pip list | grep -i -E "pyinstaller|pywebview|pyobjc-core" || true

      - name: Check every compiled part is universal
        run: |
          BAD=0
          while IFS= read -r f; do
            A=$(lipo -archs "$f" 2>/dev/null || echo "?")
            case "$A" in *x86_64*arm64*|*arm64*x86_64*) ;; *) echo "NOT UNIVERSAL ($A): $f"; BAD=1 ;; esac
          done < <(find "$RUNNER_TEMP/venv/lib" \( -name "*.so" -o -name "*.dylib" \))
          if [ "$BAD" = 1 ]; then exit 1; fi
          echo "Every compiled part carries Intel and Apple silicon code."

      - name: Build @@NAME@@.app
        env:
          APP_TARGET_ARCH: universal2
        run: |
          cd "$PROJ"
          set -o pipefail
          "$VPY" -m PyInstaller --noconfirm --clean @@FILE@@.spec 2>&1 | tee "$RUNNER_TEMP/build-log.txt"
          test -d "dist/@@NAME@@.app"
          echo "The app carries: $(lipo -archs "dist/@@NAME@@.app/Contents/MacOS/@@NAME@@")"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "dist/@@NAME@@.app/Contents/Info.plist"

      - name: If the build failed, show why
        if: failure()
        run: tail -n 80 "$RUNNER_TEMP/build-log.txt" || echo "(no build log was written)"

      - name: Open the app once, as Apple silicon and as Intel
        # Starts the finished app for 40 seconds each way, checks its page server answers at @@NAME@@'s own address,
        # photographs the screen, and reads the app's own log. The Intel run uses Rosetta.
        run: |
          cd "$PROJ"
          APP="dist/@@NAME@@.app/Contents/MacOS/@@NAME@@"
          LOG="dist/@@NAME@@.app/Contents/MacOS/@@FILE@@_crash.log"
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then softwareupdate --install-rosetta --agree-to-license > /dev/null 2>&1 || true; fi
          mkdir -p "$RUNNER_TEMP/shots"
          for MODE in arm64 x86_64; do
            rm -f "$LOG" "$HOME/@@FILE@@_crash.log"
            arch -$MODE "$APP" > "$RUNNER_TEMP/run-$MODE.txt" 2>&1 &
            PID=$!
            CODE=000; T=0
            while [ $T -lt 40 ]; do
              sleep 2; T=$((T+2))
              CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:@@PORT@@/@@FILE@@.html || true)
              if [ "$CODE" = "200" ]; then break; fi
            done
            echo "$MODE: the app's page server answered $CODE after $T seconds"
            if [ $T -lt 40 ]; then sleep $((40-T)); fi
            screencapture -x "$RUNNER_TEMP/shots/mac-$MODE.png" 2>/dev/null || echo "no screenshot"
            if kill -0 $PID 2>/dev/null; then echo "$MODE: still running after 40 seconds"; kill $PID; sleep 3; else echo "$MODE: EXITED EARLY"; cat "$RUNNER_TEMP/run-$MODE.txt"; exit 1; fi
            if [ "$CODE" != "200" ]; then echo "$MODE: the page server did not answer, so the window would be blank"; exit 1; fi
            echo "--- what the app recorded ($MODE) ---"
            cat "$LOG" 2>/dev/null || cat "$HOME/@@FILE@@_crash.log" 2>/dev/null || echo "(nothing)"
            if grep -q "Traceback" "$LOG" "$HOME/@@FILE@@_crash.log" 2>/dev/null; then echo "$MODE: a fault was recorded"; exit 1; fi
          done
          rm -f "$LOG"

      - name: Keep the screenshots with this run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2, runs on Node.js 24
        with:
          name: @@FILE@@-mac-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn

      - name: Pack the app
        run: |
          cd "$PROJ/dist"
          ditto -c -k --sequesterRsrc --keepParent "@@NAME@@.app" "$GITHUB_WORKSPACE/@@NAME_DASH@@-Mac.zip"
          ls -la "$GITHUB_WORKSPACE/@@NAME_DASH@@-Mac.zip"

      - name: Keep the app with this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2, runs on Node.js 24
        with:
          name: @@FILE@@-mac
          path: '@@NAME_DASH@@-Mac.zip'
          if-no-files-found: error

      - name: Put the app on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG=@@FILE@@-mac
          PASS=$(grep -m1 '^Pass:' "$PROJ/BUILD_INFO.txt" | tr -dc '0-9')
          NOTES="@@NAME@@ for Mac, build ${PASS}. One app for Intel and Apple silicon Macs. Built $(date -u '+%d %B %Y, %H:%M UTC') from branch ${GITHUB_REF_NAME}, commit ${GITHUB_SHA:0:7}.
          Unzip, drag @@NAME@@.app to Applications, then the first time: right-click it, Open, Open (see MACOS_IF_BLOCKED.txt). To uninstall, drag it to the Bin; your library stays in ~/Library/Application Support/@@DATA@@ until you delete that folder too."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "@@NAME_DASH@@-Mac.zip" --clobber
            gh release edit "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" "@@NAME_DASH@@-Mac.zip" --target "$GITHUB_SHA" --title "@@NAME@@ for Mac" --notes "$NOTES"
          fi
          echo "### Published @@NAME_DASH@@-Mac.zip (build ${PASS})" >> "$GITHUB_STEP_SUMMARY"
