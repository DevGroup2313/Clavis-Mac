#
# Builds @@NAME@@ for Windows on GitHub's own Windows machine, as Carpe Diem's is: the single program
# (@@NAME@@.exe, opens from anywhere) and the installer (@@NAME_DASH@@-<build>-Windows-Setup.exe), which installs for
# you alone with no administrator password, adds @@NAME@@ to the Start menu, and registers an uninstaller in
# Settings, Apps. Before publishing, the installer is tried as a person would: installed, opened, and uninstalled,
# and the folder that holds your library must come through untouched.

name: Build @@NAME@@ for Windows

on:
  push:
    paths:
      - '@@PREFIX@@Windows project/**'
      - '.github/workflows/@@FILE@@-windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: @@FILE@@-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      PROJ: '${{ github.workspace }}\@@PREFIX_WIN@@Windows project'
    steps:
      - name: Get the project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, runs on Node.js 24

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, runs on Node.js 24
        with:
          python-version: '3.12'

      - name: Install the build tools
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pyinstaller pywebview pythonnet
          python -m pip list | Select-String -Pattern "pyinstaller|pywebview|pythonnet"

      - name: Build @@NAME@@.exe
        run: |
          Set-Location $env:PROJ
          python -m PyInstaller --noconfirm --clean @@FILE@@.spec 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\build-log.txt"
          if (-not (Test-Path "dist\@@NAME@@.exe")) { Write-Error "No exe was produced."; exit 1 }
          Get-Item "dist\@@NAME@@.exe" | Format-List Name, Length

      - name: If the build failed, show why
        if: failure()
        run: Get-Content "$env:RUNNER_TEMP\build-log.txt" -Tail 80

      - name: Open the app once
        run: |
          Set-Location "$env:PROJ\dist"
          Remove-Item @@FILE@@_crash.log -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath ".\@@NAME@@.exe" -PassThru
          $code = 0
          for ($t = 0; $t -lt 40; $t += 2) {
            Start-Sleep -Seconds 2
            try { $code = (Invoke-WebRequest -UseBasicParsing -TimeoutSec 5 "http://127.0.0.1:@@PORT@@/@@FILE@@.html").StatusCode } catch { $code = 0 }
            if ($code -eq 200) { break }
          }
          "the app's page server answered $code"
          Start-Sleep -Seconds 8
          try {
            New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\shots" | Out-Null
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:RUNNER_TEMP\shots\windows.png")
          } catch { "No screenshot: $($_.Exception.Message)" }
          $alive = -not $p.HasExited
          if ($alive) { "Still running."; Stop-Process -Id $p.Id -Force } else { "EXITED EARLY with code $($p.ExitCode)" }
          "--- what the app recorded ---"
          if (Test-Path @@FILE@@_crash.log) { Get-Content @@FILE@@_crash.log } else { "(nothing)" }
          if ((Test-Path @@FILE@@_crash.log) -and (Select-String -Path @@FILE@@_crash.log -Pattern "Traceback" -Quiet)) { Write-Error "A fault was recorded."; exit 1 }
          if (-not $alive) { exit 1 }
          if ($code -ne 200) { Write-Error "The page server did not answer, so the window would be blank."; exit 1 }
          Remove-Item @@FILE@@_crash.log -ErrorAction SilentlyContinue

      - name: Keep the screenshot with this run
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2, runs on Node.js 24
        with:
          name: @@FILE@@-windows-screenshot
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn

      - name: Build the installed version (a folder)
        run: |
          Set-Location $env:PROJ
          python -m PyInstaller --noconfirm --clean --distpath dist_installed @@FILE@@_onedir.spec 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP\build-onedir-log.txt"
          if (-not (Test-Path "dist_installed\@@NAME@@\@@NAME@@.exe")) { Get-Content "$env:RUNNER_TEMP\build-onedir-log.txt" -Tail 60; Write-Error "No folder build was produced."; exit 1 }

      - name: Make the installer
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { Write-Error "Inno Setup could not be found or installed."; exit 1 }
          $pass = ((Select-String -Path "$env:PROJ\BUILD_INFO.txt" -Pattern '^Pass:').Line -replace '[^0-9]', '')
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\out" | Out-Null
          & $iscc /Qp "/DAppVersion=$pass" "/DSourceDir=$env:PROJ\dist_installed\@@NAME@@" "/DOutputDir=$env:GITHUB_WORKSPACE\out" "$env:PROJ\build\@@FILE@@.iss"
          $setup = "@@NAME_DASH@@-$pass-Windows-Setup.exe"
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\out\$setup")) { Write-Error "No installer was made."; exit 1 }
          "SETUP_NAME=$setup" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install, open, and uninstall it, as a person would
        run: |
          $setup = "$env:GITHUB_WORKSPACE\out\$env:SETUP_NAME"
          $app = Join-Path $env:LOCALAPPDATA "Programs\@@NAME@@"
          $store = Join-Path $env:LOCALAPPDATA "@@DATA@@\storage"
          New-Item -ItemType Directory -Force -Path $store | Out-Null
          Set-Content -Path (Join-Path $store "keep-me.txt") -Value "a library that must survive"
          $i = Start-Process -FilePath $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=desktopicon' -PassThru -Wait
          "installer exit code: $($i.ExitCode)"
          if (-not (Test-Path "$app\@@NAME@@.exe")) { Write-Error "The installer did not put @@NAME@@.exe in $app"; exit 1 }
          "Start menu shortcut: $(Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) '@@NAME@@.lnk'))"
          "Desktop shortcut: $(Test-Path (Join-Path ([Environment]::GetFolderPath('Desktop')) '@@NAME@@.lnk'))"
          $p = Start-Process -FilePath "$app\@@NAME@@.exe" -PassThru
          Start-Sleep -Seconds 25
          $alive = -not $p.HasExited
          if ($alive) { "The installed @@NAME@@ is running."; Stop-Process -Id $p.Id -Force } else { "EXITED EARLY with code $($p.ExitCode)" }
          if (Test-Path "$app\@@FILE@@_crash.log") { Get-Content "$app\@@FILE@@_crash.log" }
          if (-not $alive) { exit 1 }
          Start-Sleep -Seconds 2
          $u = Start-Process -FilePath "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          for ($k = 0; $k -lt 60 -and (Test-Path "$app\@@NAME@@.exe"); $k++) { Start-Sleep -Seconds 1 }
          "uninstaller exit code: $($u.ExitCode)"
          if (Test-Path "$app\@@NAME@@.exe") { Write-Error "Uninstalling left the program behind."; exit 1 }
          if (-not (Test-Path (Join-Path $store "keep-me.txt"))) { Write-Error "Uninstalling touched the library folder."; exit 1 }
          "Uninstalled cleanly; the library folder is untouched."

      - name: Pack the single program
        run: |
          Compress-Archive -Path "$env:PROJ\dist\@@NAME@@.exe" -DestinationPath "$env:GITHUB_WORKSPACE\@@NAME_DASH@@-Windows.zip" -Force

      - name: Keep both with this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2, runs on Node.js 24
        with:
          name: @@FILE@@-windows
          path: |
            out/${{ env.SETUP_NAME }}
            @@NAME_DASH@@-Windows.zip
          if-no-files-found: error

      - name: Put them on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = "@@FILE@@-windows"
          $pass = ((Select-String -Path "$env:PROJ\BUILD_INFO.txt" -Pattern '^Pass:').Line -replace '[^0-9]', '')
          $notes = "@@NAME@@ for Windows, build $pass. Built $((Get-Date).ToUniversalTime().ToString('dd MMMM yyyy, HH:mm')) UTC from branch $env:GITHUB_REF_NAME.`nInstall: run $env:SETUP_NAME (no administrator password). Uninstall: Settings, Apps, @@NAME@@, Uninstall; your library stays in %LOCALAPPDATA%\@@DATA@@.`nOr unzip @@NAME_DASH@@-Windows.zip for the single program that opens from anywhere."
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "out\$env:SETUP_NAME" "@@NAME_DASH@@-Windows.zip" --clobber
            gh release edit $tag --notes $notes
          } else {
            gh release create $tag "out\$env:SETUP_NAME" "@@NAME_DASH@@-Windows.zip" --target $env:GITHUB_SHA --title "@@NAME@@ for Windows" --notes $notes
          }
